name: Deploy ASP.NET Core App to Azure

on:
  push:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: your-app-name
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CampusConnect/CampusConnect.csproj

      - name: Build
        run: dotnet build  CampusConnect/CampusConnect.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish  CampusConnect/CampusConnect.csproj -c Release -o publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish